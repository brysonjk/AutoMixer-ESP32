[env:esp32-s3-devkitc-1]
; pioarduino build: Arduino 3.3.12 / ESP-IDF 5.5.5. Needed for esp_lcd bounce buffers,
; which keep the RGB panel's DMA fed while the CPU is hitting flash and PSRAM.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Build flags
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -I include

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries
lib_deps =
    lvgl/lvgl@^8.3.11
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit BusIO@^1.16.1

; Partition scheme for larger apps
board_build.partitions = huge_app.csv

; Flash settings
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; QIO flash + Octal PSRAM (ESP32-S3-WROOM-1 N16R8)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; Rebuilds the framework libraries with a custom sdkconfig. Slow on the first build.
;
; TRY_ALLOCATE_WIFI_LWIP=n is the fix for WiFi disturbing the display: by default the
; WiFi and network buffers live in PSRAM, so every packet (the AP's beacons alone arrive
; ~10x a second) competes with the RGB panel's framebuffer reads and the image jumps.
; Confirmed by disabling the radio, which made the display fully stable.
;
; The rest is the platform's own "OPI performance / display use" profile: IRAM-safe LCD
; and GDMA interrupts so NVS writes (WiFi connects) can't stall them, code and rodata
; executed from PSRAM so flash operations don't stall the cache, and a larger data cache.
custom_sdkconfig =
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    CONFIG_GDMA_ISR_IRAM_SAFE=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
