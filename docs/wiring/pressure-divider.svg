<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 200" role="img" aria-label="Pressure divider: the transducer output passes a 10k resistor to the ADS1115 input, with a 20k resistor from that input to ground, scaling 4.5 volts to 3.0 volts." width="640" height="200">
<style>svg{
  --paper:#EEF1F0; --sheet:#FFFFFF; --ink:#1A2328; --muted:#5B6870; --rule:#CBD3D6; --box:#F3F6F6; --board:#E6EEEA;
  --w10:#C62828; --w5:#C75F00; --w33:#8C6A00; --gnd:#3B4A52; --i2c:#1F63C6; --pwm:#13804A; --sig:#7A3DB8;
  --warn-bg:#FFF4E5; --warn-ink:#7A3E00;
}
@media (prefers-color-scheme: dark){svg{
  color-scheme:dark;
  --paper:#0E1316; --sheet:#151C20; --ink:#DCE3E6; --muted:#93A1A8; --rule:#2C373D; --box:#1B2429; --board:#172620;
  --w10:#FF6B6B; --w5:#FFA24D; --w33:#E3C04A; --gnd:#9AABB3; --i2c:#6AA5FF; --pwm:#4FCB86; --sig:#B98CF0;
  --warn-bg:#2A1E10; --warn-ink:#FFC680;
}}
.bg{fill:var(--sheet)}
/* diagram classes */
.box{fill:var(--box);stroke:var(--ink);stroke-width:1.2}
.board{fill:var(--board);stroke:var(--ink);stroke-width:1.6}
.pin{fill:var(--ink)}
.t{fill:var(--ink);font:13px "IBM Plex Sans",system-ui,sans-serif}
.tb{fill:var(--ink);font:600 13px "IBM Plex Sans",system-ui,sans-serif}
.th{fill:var(--ink);font:600 16px "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif}
.tm{fill:var(--ink);font:12px "IBM Plex Mono",monospace}
.ts{fill:var(--muted);font:11.5px "IBM Plex Sans",system-ui,sans-serif}
.tg{fill:var(--muted);font:600 11px "IBM Plex Mono",monospace;letter-spacing:.06em}
.w{fill:none;stroke-width:2.2;stroke-linejoin:round}
.w10{stroke:var(--w10)} .w5{stroke:var(--w5)} .w33{stroke:var(--w33)} .wg{stroke:var(--gnd)}
.wi{stroke:var(--i2c)} .wp{stroke:var(--pwm)} .ws{stroke:var(--sig)} .wk{stroke:var(--ink)}
.c10{fill:var(--w10)} .c5{fill:var(--w5)} .c33{fill:var(--w33)} .ci{fill:var(--i2c)} .cp{fill:var(--pwm)} .cs{fill:var(--sig)} .cg{fill:var(--gnd)} .ck{fill:var(--ink)}
.gs{color:var(--gnd)}
.thick{stroke-width:4}
.dash{stroke-dasharray:6 5}
</style>
<rect class="bg" x="0" y="0" width="640" height="200"/>
          <defs>
            <g id="gnd4" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M0 0v8M-9 8h18M-5.5 12.5h11M-2 17h4"/></g>
          </defs>
          <rect class="box" x="20" y="64" width="150" height="56" rx="3"/>
          <text class="tb" x="95" y="88" text-anchor="middle">Pressure transducer</text>
          <text class="ts" x="95" y="105" text-anchor="middle">0.5–4.5 V out</text>
          <path class="w w5" d="M95 64V34"/>
          <text class="t" x="103" y="38" style="fill:var(--w5)">+5 V</text>
          <path class="w wg" d="M95 120V140"/>
          <use xlink:href="#gnd4" class="gs" x="95" y="140"/>

          <path class="w ws" d="M170 92H230M290 92H470M340 92V112M340 152V164"/>
          <circle class="cs" cx="340" cy="92" r="3.5"/>
          <rect class="box" x="230" y="84" width="60" height="16" rx="2"/>
          <text class="tm" x="260" y="76" text-anchor="middle">10k</text>
          <rect class="box" x="332" y="112" width="16" height="40" rx="2"/>
          <text class="tm" x="358" y="136">20k</text>
          <use xlink:href="#gnd4" class="gs" x="340" y="164"/>
          <text class="ts" x="405" y="84" text-anchor="middle">≤ 3.0 V</text>

          <rect class="box" x="470" y="72" width="150" height="40" rx="3"/>
          <text class="tb" x="545" y="97" text-anchor="middle">ADS1115 A2 / A3</text>
        </svg>
